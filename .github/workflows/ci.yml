name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-typecheck-build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Biome format check (pages/api + lib only)
        # Full biome ci on the whole repo is blocked by ~276 pre-existing a11y
        # errors in components/admin that the frontend engineer will fix.
        # Gate the API/lib layer now; widen scope once frontend wave lands.
        run: npx biome ci lib/ pages/api/

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Next.js build
        run: npm run build
        env:
          # Provide dummy values so the env validator doesn't abort the build.
          # Real values live in Vercel; these are build-time placeholders only.
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder_service_role_key
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          SHIPPO_API_KEY: shippo_test_placeholder
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_anon_key
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts','**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
